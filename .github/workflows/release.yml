name: Release

on:
  release:
    types: [published]

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go test ./...
      - run: go build ./apps/daemon
      - run: go build ./apps/desktop
