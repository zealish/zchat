name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    # Adw.ToggleGroup in window.blp needs libadwaita 1.7+, newer than the
    # runner image ships. Fedora's GNOME 48 packages are new enough.
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y gcc git make rpm-build golang \
            gtk4-devel libadwaita-devel blueprint-compiler
      - uses: actions/checkout@v4
      # The checkout is owned by a different uid than the container user, so
      # git refuses to report status and go's VCS stamping fails.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Fedora's golang package trails the go directive in go.mod, so the
      # toolchain comes from setup-go rather than the container.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate UI resources
        run: make ui
      - run: go test ./...
      - run: go build ./apps/daemon
      - run: go build ./apps/desktop

      # The spec builds from the vendored tarball, so `make rpm` needs the
      # generated UI resources already present in the working copy.
      - name: Build RPM
        run: make rpm VERSION="${GITHUB_REF_NAME#v}"
      - name: Attach RPM to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpm
