syntax = "proto3";

package zchat.v1;

option go_package = "github.com/zealish/zchat/packages/ipc/zchatv1;zchatv1";

service ChatService {
  rpc GetChats(GetChatsRequest) returns (GetChatsResponse);
  rpc GetContacts(GetContactsRequest) returns (GetContactsResponse);
  rpc StartChat(StartChatRequest) returns (StartChatResponse);
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc SendMedia(SendMediaRequest) returns (SendMediaResponse);
  rpc ForwardMessage(ForwardMessageRequest) returns (ForwardMessageResponse);
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  rpc UpdateChat(UpdateChatRequest) returns (UpdateChatResponse);
  rpc GetConnectionState(GetConnectionStateRequest) returns (ConnectionState);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc DownloadMedia(DownloadMediaRequest) returns (DownloadMediaResponse);
  rpc SearchChats(SearchChatsRequest) returns (SearchChatsResponse);
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);
  rpc SetPresence(SetPresenceRequest) returns (SetPresenceResponse);
  rpc RetryMessage(RetryMessageRequest) returns (RetryMessageResponse);
  rpc RetryMedia(RetryMessageRequest) returns (RetryMediaResponse);
  rpc ReactMessage(ReactMessageRequest) returns (ReactMessageResponse);
  rpc GetChatInfo(GetChatInfoRequest) returns (GetChatInfoResponse);
  rpc GetProfilePicture(GetProfilePictureRequest) returns (GetProfilePictureResponse);
  rpc GetSyncState(GetSyncStateRequest) returns (SyncState);
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
}

message Chat {
  string jid = 1;
  string name = 2;
  int32 unread = 3;
  bool archived = 4;
  bool pinned = 5;
  string last_message = 6;
  int64 updated_at = 7; // unix seconds
  bool is_group = 8;
  int64 muted_until = 9; // unix seconds; -1 = muted forever, 0 = not muted
}

enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  MESSAGE_STATUS_PENDING = 1;
  MESSAGE_STATUS_SENT = 2;
  MESSAGE_STATUS_DELIVERED = 3;
  MESSAGE_STATUS_READ = 4;
  MESSAGE_STATUS_FAILED = 5;
}

message Message {
  string id = 1;
  string chat_jid = 2;
  string sender = 3;
  string sender_name = 4;
  string body = 5;
  string type = 6; // "text", "image", "video", "audio", "document", "sticker"
  int64 timestamp = 7; // unix seconds
  bool outgoing = 8;
  MessageStatus status = 9;
  MediaInfo media = 10; // set when type != "text"
  QuotedMessage quoted = 11; // set when this message replies to another
  bool forwarded = 12;
  string reaction = 13; // legacy current-user reaction
  repeated MessageReaction reactions = 14;
}

message MessageReaction {
  string sender = 1;
  string sender_name = 2;
  string emoji = 3;
}

// QuotedMessage is the snapshot of the message a reply points at. The original
// may be missing locally, so the preview text is stored alongside the id.
message QuotedMessage {
  string id = 1;
  string sender = 2;
  string sender_name = 3;
  string body = 4;
  string type = 5;
}

// MediaInfo describes an attachment. path is empty until the media has been
// downloaded; clients call DownloadMedia to materialise it.
message MediaInfo {
  string mime = 1;
  int64 size = 2;
  string filename = 3;
  string caption = 4;
  string path = 5; // local file path, empty when not downloaded yet
  bytes thumbnail = 6; // JPEG preview embedded by WhatsApp, may be empty
  int32 width = 7;
  int32 height = 8;
  int32 duration = 9; // seconds, audio and video only
}

enum ConnectionStatus {
  CONNECTION_STATUS_UNSPECIFIED = 0;
  CONNECTION_STATUS_DISCONNECTED = 1;
  CONNECTION_STATUS_CONNECTING = 2;
  CONNECTION_STATUS_CONNECTED = 3;
  CONNECTION_STATUS_LOGGED_OUT = 4; // needs QR pairing
}

message ConnectionState {
  ConnectionStatus status = 1;
  string own_jid = 2;
  string push_name = 3;
  string error = 4;
}

// SyncStage tracks the one-time full sync that follows a fresh pairing. The
// client blocks its main view until the stage reaches DONE so chats and
// contacts are complete before anything is rendered.
enum SyncStage {
  SYNC_STAGE_UNSPECIFIED = 0;
  SYNC_STAGE_IDLE = 1;       // nothing to sync, or sync already finished
  SYNC_STAGE_CONNECTING = 2;
  SYNC_STAGE_CONTACTS = 3;
  SYNC_STAGE_HISTORY = 4;
  SYNC_STAGE_FINALIZING = 5;
  SYNC_STAGE_DONE = 6;
}

// SyncState reports full-sync progress. progress is 0..1; when the daemon
// cannot estimate it, indeterminate is set and progress is ignored.
message SyncState {
  SyncStage stage = 1;
  double progress = 2;
  bool indeterminate = 3;
  string detail = 4;
  int32 chats_synced = 5;
  int32 messages_synced = 6;
  int32 contacts_synced = 7;
}

message GetSyncStateRequest {}

message GetChatsRequest {
  int32 limit = 1;
  int32 offset = 2;
  bool archived = 3; // return the archived list instead of the active one
}

message GetChatsResponse {
  repeated Chat chats = 1;
}

message Contact {
  string jid = 1;
  string name = 2;
  string phone_number = 3;
}

message GetContactsRequest {}
message GetContactsResponse { repeated Contact contacts = 1; }
message StartChatRequest { string recipient = 1; }
message StartChatResponse { Chat chat = 1; }

message GetMessagesRequest {
  string chat_jid = 1;
  int32 limit = 2; // daemon clamps to 200 when 0 or >200
  int64 before_timestamp = 3; // 0 = most recent
}

message GetMessagesResponse {
  repeated Message messages = 1;
}

message SendMessageRequest {
  string chat_jid = 1;
  string body = 2;
  string quoted_message_id = 3; // optional; reply to this message
}

message SendMessageResponse {
  Message message = 1;
}

// SendMediaRequest uploads a local file as an attachment. The daemon reads
// file_path itself, so client and daemon must share a filesystem, which the
// Unix socket transport already implies.
message SendMediaRequest {
  string chat_jid = 1;
  string file_path = 2;
  string caption = 3;
  string quoted_message_id = 4; // optional; reply to this message
}

message SendMediaResponse {
  Message message = 1;
}

message ForwardMessageRequest {
  string message_id = 1;
  string to_chat_jid = 2;
}

message ForwardMessageResponse {
  Message message = 1;
}

// DeleteMessageRequest removes a message locally. When revoke is set and the
// message is the user's own, it is also revoked for everyone.
message DeleteMessageRequest {
  string message_id = 1;
  bool revoke = 2;
}

message DeleteMessageResponse {}

// UpdateChatRequest toggles local and app-state chat flags. Unset fields are
// left untouched.
message UpdateChatRequest {
  string chat_jid = 1;
  optional bool pinned = 2;
  optional bool archived = 3;
  optional int64 muted_until = 4; // -1 = mute forever, 0 = unmute
}

message UpdateChatResponse {
  Chat chat = 1;
}

message GetConnectionStateRequest {}

message LogoutRequest {}

message LogoutResponse {}

message DownloadMediaRequest {
  string message_id = 1;
}

message DownloadMediaResponse {
  Message message = 1;
}

message SearchChatsRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchChatsResponse {
  repeated Chat chats = 1;
}

// SearchMessagesRequest finds messages by body text. chat_jid scopes the search
// to one conversation; empty searches every chat.
message SearchMessagesRequest {
  string query = 1;
  string chat_jid = 2;
  int32 limit = 3; // daemon clamps to 200 when 0 or >200
}

message SearchMessagesResponse {
  repeated Message messages = 1;
}

message StreamEventsRequest {}

message QRUpdate {
  string code = 1;
  int64 expires_at = 2;
}

message MessageDeleted {
  string id = 1;
  string chat_jid = 2;
}

// PresenceUpdate reports either a chat-level typing state or a user's
// online/offline transition. chat_jid is the conversation the update belongs
// to; for direct chats it equals the user's JID.
message PresenceUpdate {
  string chat_jid = 1;
  string user_jid = 2;
  string user_name = 3;
  bool typing = 4;
  bool recording = 5; // typing a voice message rather than text
  bool online = 6;
  int64 last_seen = 7; // unix seconds; 0 when unknown or hidden
}

// SetPresenceRequest reports the local user's activity. typing applies to
// chat_jid; available toggles the global online marker, which WhatsApp also
// requires before it sends any presence back.
message SetPresenceRequest {
  string chat_jid = 1;
  bool typing = 2;
  bool available = 3;
}

message RetryMessageRequest {
  string message_id = 1;
}

message RetryMessageResponse {
  Message message = 1;
}

message RetryMediaResponse {
  Message message = 1;
}

message SetPresenceResponse {}
message ReactMessageRequest { string message_id = 1; string emoji = 2; }
message ReactMessageResponse { Message message = 1; }

message GetChatInfoRequest { string chat_jid = 1; }
message GetChatInfoResponse { Chat chat = 1; repeated Contact members = 2; }

// GetProfilePictureRequest asks for a contact's or group's avatar. The daemon
// caches the image on disk and returns its local path.
message GetProfilePictureRequest { string jid = 1; }

// GetProfilePictureResponse carries the cached avatar path, empty when the
// target has no picture set.
message GetProfilePictureResponse { string jid = 1; string path = 2; }

// ProfilePictureUpdate announces that an avatar changed. path is empty when the
// picture was removed.
message ProfilePictureUpdate { string jid = 1; string path = 2; }

// ChatDeleted announces that a chat row no longer exists, either because it was
// merged into another chat or removed.
message ChatDeleted { string jid = 1; }

message Event {
  oneof payload {
    Message message_received = 1;
    Message message_updated = 2;
    Chat chat_updated = 3;
    QRUpdate qr_updated = 4;
    ConnectionState connection_state = 5;
    MessageDeleted message_deleted = 6;
    PresenceUpdate presence_changed = 7;
    ProfilePictureUpdate profile_picture_updated = 8;
    SyncState sync_state = 9;
    ChatDeleted chat_deleted = 10;
  }
}
